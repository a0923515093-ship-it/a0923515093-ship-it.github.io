media:
  label: 商品照片
  input: img/products
  output: /img/products
  extensions:
  - svg
  - jpg
  - jpeg
  - png
  - webp
  - gif
content:
- name: products-bmw
  label: 商品｜BMW
  type: file
  path: content/products/bmw.json
  format: json
  list: true
  fields:
  - description: 既有商品請保留編號。
    label: 編號
    name: id
    type: string
  - label: 品名
    name: name
    required: true
    type: string
  - label: 品牌
    name: brand
    options:
      values:
      - label: BMW
        name: bmw
      - label: Mercedes-Benz
        name: benz
      - label: Audi
        name: audi
      - label: Porsche
        name: porsche
      - label: Volkswagen
        name: vw
      - label: Toyota
        name: toyota
      - label: Lexus
        name: lexus
      - label: Honda
        name: honda
      - label: Ferrari
        name: ferrari
      - label: Lamborghini
        name: lamborghini
    required: true
    type: select
    default: bmw
  - description: 例如 3系列 G20。
    label: 車型
    name: model
    type: string
  - label: 類別
    name: category
    options:
      values:
      - label: 撥片
        name: paddle
      - label: 排氣管
        name: exhaust
      - label: 避震 / 懸吊
        name: suspension
      - label: 輪圈
        name: wheel
      - label: 煞車
        name: brake
      - label: 進氣
        name: intake
      - label: 外觀套件
        name: aero
      - label: 內裝
        name: interior
      - label: 電腦調校 / 改裝服務
        name: tuning
    required: true
    type: select
  - description: 可留空。
    label: 價格
    name: price
    options:
      min: 0
    type: number
  - label: 說明
    name: description
    type: text
  - label: 照片
    list: true
    name: images
    options:
      extensions:
      - svg
      - jpg
      - jpeg
      - png
      - webp
      - gif
    type: image
  - default: false
    label: 熱銷精選
    name: featured
    type: boolean
  - default: true
    label: 上架
    name: published
    type: boolean
